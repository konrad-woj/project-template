[project]
name = "agentic-idp-app"
version = "0.1.0"
description = "Agentic Intelligent Document Processing: OCR, layout detection, reading order, and VLM-powered question answering."
readme = "README.md"
requires-python = "~=3.13.0"

dependencies = [
    "langchain>=1.2.10",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "logger",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.10.0",
    "paddleocr>=2.8.0",
    "pillow>=11.1.0",
    "python-dotenv>=1.0.0",
    "torch>=2.5.0",
    "transformers>=4.40.0",
]

[tool.uv.sources]
logger = { path = "../logger", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "taskipy>=1.14.0",
    "pytest-asyncio",
]

[project.optional-dependencies]

[project.scripts]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_idp_app"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint]
select = ["A", "B", "C", "E", "F", "W", "I", "UP", "FURB", "RUF", "PD"]
exclude = [".venv"]
ignore = ["E501", "C901"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.taskipy.tasks]
precommit = { cmd = "uvx ruff format . && uvx ruff check . --fix --unsafe-fixes && uvx pyright .", help = "Lint, format and typecheck Python codebase" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
