[project]
name = "example-service"
version = "0.1.0"
description = "Example runnable FastAPI service, for reference when adding a new one"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "example-library",
    "fastapi>=0.138.0,<1.0.0",
    "hydra-core>=1.3.6",
    "logger",
    "pydantic>=2.13.0,<3.0.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.49.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "pyright>=1.1.400,<2.0.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "ruff>=0.15.0,<1.0.0",
    "tach>=0.35.0,<1.0.0",
    "taskipy>=1.14.0,<2.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint]
select = ["A", "B", "C", "E", "F", "W", "I", "UP", "FURB", "RUF", "PD"]
exclude = [".venv"]
ignore = ["E501", "C901"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"

[tool.taskipy.tasks]
precommits = { cmd = "uv run ruff format . && uv run ruff check . --fix --unsafe-fixes && uv run pyright . && uv run tach check && npx --yes markdownlint-cli@0.49.1 '**/*.md' --ignore .venv --config ../../.markdownlint.json", help = "Format, lint and typecheck Python, check module boundaries, and lint Markdown docs" }
tach = { cmd = "uv run tach check", help = "Check module boundaries against tach.toml" }
ci = { cmd = "uv run ruff format --check . && uv run ruff check . && uv run pyright . && uv run tach check && uv run pytest tests/", help = "Non-mutating gate used by CI: format check, lint, typecheck, boundaries, tests" }
test = { cmd = "uv run pytest tests/unit", help = "Run unit tests" }
app = { cmd = "PYTHONPATH=src uv run python -m example_service --port 8000", help = "Run the API dev server" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = false

[tool.uv.sources]
example-library = { path = "../example-library", editable = true }
logger = { git = "https://github.com/konrad-woj/logger.git" }
