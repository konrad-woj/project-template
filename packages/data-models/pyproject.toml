[project]
name = "data-models"
version = "0.1.0"
description = "AI Models"
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "pydantic>=2.11",
]

[tool.uv.sources]


[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "taskipy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["data_models"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint]
select = ["A", "B", "C", "E", "F", "W", "I", "UP", "FURB", "RUF", "PD"]
exclude = [".venv"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.taskipy.tasks]
precommits = { cmd = "uvx ruff check . && uvx ruff format . && uvx pyright . && npx --yes markdownlint-cli@0.49.1 '**/*.md' --ignore .venv", help = "Run lint, format, and typecheck, and lint Markdown docs" }
