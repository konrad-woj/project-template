[project]
name = "rapid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "konradwojciechowski", email = "konrad.woj@gmail.com" }
]
requires-python = "~=3.13.0"
dependencies = [
    "onnxruntime>=1.24.2",
    "rapidocr>=3.6.0",
    "logger",
    "rapid-layout>=1.2.0",
    "rapid-table[torch]>=3.0.1",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
logger = { path = "../logger", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "taskipy>=1.14.0",
    "pytest-asyncio",
]

[project.optional-dependencies]

[project.scripts]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint]
select = ["A", "B", "C", "E", "F", "W", "I", "UP", "FURB", "RUF", "PD"]
exclude = [".venv"]
ignore = ["E501", "C901"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.taskipy.tasks]
precommit = { cmd = "uvx ruff format . && uvx ruff check . --fix --unsafe-fixes && uvx pyright .", help = "Lint, format and typecheck Python codebase" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
