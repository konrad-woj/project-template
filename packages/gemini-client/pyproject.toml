[project]
name = "gemini-client"
version = "0.1.0"
description = "Gemini Python Client"
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "aiobotocore>=2.20.0",
    "boto3>=1.37.1",
    "google-genai>=1.21.1",
    "jinja2>=3.1.6",
    "langfuse>=3.5.1",
    "logger",
    "pillow>=11.1.0",
]

[tool.uv.sources]
logger = { path = "../logger", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "taskipy>=1.14.0",
    "pytest-asyncio",
]

[project.optional-dependencies]

[project.scripts]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint]
select = ["A", "B", "C", "E", "F", "W", "I", "UP", "FURB", "RUF", "PD"]
exclude = [".venv"]
ignore = ["E501", "C901",]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.taskipy.tasks]
precommit = { cmd = "uvx ruff format . && uvx ruff check . --fix --unsafe-fixes && uvx pyright .", help = "Lint, format and typecheck Python codebase" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"